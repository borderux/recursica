<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recursica UI Kit - Adapter Dev Mode</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      overflow: hidden;
    }
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .header {
      height: 42px;
      box-sizing: border-box;
      flex: 0 0 42px;
      padding: 0 15px;
      background-color: #252526;
      border-bottom: 1px solid #333;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status {
      font-size: 11px;
      color: #aaa;
      text-transform: none;
      letter-spacing: normal;
      font-weight: normal;
    }
    .status.connected {
      color: #4CAF50;
    }
    .diff-tools {
      display: none;
      align-items: center;
      gap: 8px;
      text-transform: none;
      letter-spacing: normal;
      font-weight: normal;
      font-size: 12px;
    }
    .diff-badge {
      padding: 2px 8px;
      border-radius: 10px;
      background: #444;
      color: #fff;
      font-weight: 600;
    }
    .diff-badge.under { background: #2e7d32; }
    .diff-badge.over { background: #c62828; }
    .diff-tools input {
      width: 70px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 2px 4px;
    }
    .diff-tools button, .golden-tabs > button {
      background: #3a3d41;
      color: #fff;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .diff-tools button:disabled { opacity: 0.5; cursor: default; }
    .golden-tabs button.active { background: #007acc; border-color: #007acc; }
    .golden-tabs { align-items: center; }
    #goldenView {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      background: #fff;
    }
    .golden-tabs {
      display: flex;
      gap: 6px;
      margin-left: auto;
      margin-right: 12px;
      text-transform: none;
      letter-spacing: normal;
      font-weight: normal;
      font-size: 12px;
    }
    #goldenImgWrap {
      flex: 1;
      overflow: auto;
      background: #e6e6e6;
    }
    #goldenImgWrap { position: relative; }
    #goldenImg { display: block; max-width: none; }
    #goldenSpinner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      border: 4px solid #bbb;
      border-top-color: #007acc;
      border-radius: 50%;
      animation: golden-spin 0.8s linear infinite;
    }
    @keyframes golden-spin { to { transform: rotate(360deg); } }
    iframe {
      flex: 1;
      border: none;
      width: 100%;
      background: white;
    }
    .divider {
      width: 4px;
      background: #333;
      cursor: col-resize;
      z-index: 10;
      transition: background 0.2s;
    }
    .divider:hover {
      background: #007acc;
    }
    .h-divider {
      height: 4px;
      background: #333;
      cursor: row-resize;
      z-index: 10;
      transition: background 0.2s;
    }
    .h-divider:hover {
      background: #007acc;
    }
    .right-top {
      flex: 0 0 70%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .right-bottom {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: #1e1e1e;
    }
    .notes-area {
      flex: 1;
      padding: 15px;
      background: transparent;
      border: none;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 13px;
      resize: none;
      outline: none;
    }
    .btn {
      background: #0e639c;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .btn:hover {
      background: #1177bb;
    }
    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #252526;
      border: 1px solid #444;
      width: 60%;
      height: 70%;
      display: flex;
      flex-direction: column;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-header {
      padding: 15px;
      border-bottom: 1px solid #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 16px;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 20px;
      cursor: pointer;
    }
    .close-btn:hover { color: white; }
    .report-area {
      flex: 1;
      padding: 15px;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      font-family: monospace;
      resize: none;
      outline: none;
    }
    .modal-footer {
      padding: 10px 15px;
      border-top: 1px solid #444;
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="pane" id="leftPane">
    <div class="header">
      <span id="ownLabel">Target</span>
      <span class="status connected" id="ownStatus">Connected & Syncing</span>
    </div>
    <!-- Load this project's own Storybook via the SAME ORIGIN proxy -->
    <iframe id="own" src="/?path=/story/ui-kit-slider--default"></iframe>
  </div>

  <div class="divider" id="vDivider"></div>

  <div class="pane" id="rightPane">
    <div class="right-top" id="rightTop">
      <div class="header">
        <span id="sourceOfTruthLabel">Source of Truth</span>
        <span class="golden-tabs" id="goldenTabs">
          <button data-view="live" class="active">Live</button>
          <button data-view="golden">Golden</button>
          <button data-view="diff" id="computeDiffBtn">Compute Diff</button>
          <span class="diff-tools" id="diffResult">
            <input type="number" min="0" step="1" id="thresholdInput" title="Threshold (pixels)">
            <button id="saveThresholdBtn" disabled>Save</button>
            <span class="diff-badge" id="diffBadge"></span>
          </span>
        </span>
        <span class="status connected" id="sourceOfTruthStatus">Ready</span>
      </div>
      <!-- Spacer to align the view with the own Storybook's header (40px) -->
      <div id="sotSpacer" style="height: 40px; flex: 0 0 40px; background-color: #fff; border-bottom: 1px solid #e6e6e6; box-sizing: border-box;"></div>
      <!-- Load the bare source-of-truth component preview -->
      <iframe id="sourceOfTruth" src=""></iframe>
      <div id="goldenView">
        <div id="goldenImgWrap"><img id="goldenImg" alt=""><div id="goldenSpinner"></div></div>
      </div>
    </div>
    
    <div class="h-divider" id="hDivider"></div>
    
    <div class="right-bottom" id="rightBottom">
      <div class="header">
        <span>Component Notes <span id="currentNoteId" style="color:#aaa; text-transform:none; font-weight:normal; margin-left: 10px;"></span></span>
        <button class="btn" id="fullReportBtn">Full Report</button>
      </div>
      <textarea id="notesArea" class="notes-area" placeholder="Take notes on visual differences here... They will be automatically saved locally for this specific component state."></textarea>
    </div>
  </div>

  <!-- Full Report Modal -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Component Discrepancy Report</h2>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <textarea id="reportArea" class="report-area" readonly></textarea>
      <div class="modal-footer">
        <button class="btn" id="clearNotesBtn" style="padding: 8px 15px; margin-right: 10px; background-color: #d32f2f;">Clear All Notes</button>
        <button class="btn" id="copyReportBtn" style="padding: 8px 15px;">Copy to Clipboard</button>
      </div>
    </div>
  </div>

  <script>
    // Injected by the dev server — see src/devServer.ts.
    const devConfig = window.__ADAPTER_TESTER__ || { ownName: 'Target', sourceOfTruthName: 'Source of Truth', sourceOfTruthPort: 6011 };
    document.getElementById('ownLabel').textContent = devConfig.ownName;
    document.getElementById('sourceOfTruthLabel').textContent = `${devConfig.sourceOfTruthName} v${devConfig.sourceOfTruthVersion} (Truth)`;

    const ownIframe = document.getElementById('own');
    const sourceOfTruthIframe = document.getElementById('sourceOfTruth');
    const sourceOfTruthStatus = document.getElementById('sourceOfTruthStatus');

    // Sync initial iframe sources with outer URL if params exist, else fall
    // back to a sensible default story so both panes load something on open.
    const outerParams = new URLSearchParams(window.location.search);
    const initialId = outerParams.get('id') || 'ui-kit-slider--default';
    const initialArgs = outerParams.get('args');

    let ownSrc = `/?path=/story/${initialId}`;
    if (initialArgs) {
      ownSrc += `&args=${initialArgs}`;
    }
    ownIframe.src = ownSrc;

    let sotSrc = `http://localhost:${devConfig.sourceOfTruthPort}/iframe.html?id=${initialId}&viewMode=story`;
    if (initialArgs) {
      sotSrc += `&args=${initialArgs}`;
    }
    sourceOfTruthIframe.src = sotSrc;

    // Resizers
    const vDivider = document.getElementById('vDivider');
    const leftPane = document.getElementById('leftPane');
    const hDivider = document.getElementById('hDivider');
    const rightTop = document.getElementById('rightTop');
    
    // Notes
    const notesArea = document.getElementById('notesArea');
    const currentNoteIdLabel = document.getElementById('currentNoteId');
    let currentStoryId = '';

    // Modal
    const reportModal = document.getElementById('reportModal');
    const fullReportBtn = document.getElementById('fullReportBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const reportArea = document.getElementById('reportArea');
    const copyReportBtn = document.getElementById('copyReportBtn');

    // Resizing Logic - Vertical
    let isVResizing = false;
    vDivider.addEventListener('mousedown', (e) => {
      isVResizing = true;
      document.body.style.cursor = 'col-resize';
      ownIframe.style.pointerEvents = 'none';
      sourceOfTruthIframe.style.pointerEvents = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (isVResizing) {
        const totalWidth = document.body.offsetWidth;
        const percentage = (e.clientX / totalWidth) * 100;
        if (percentage > 20 && percentage < 80) {
          leftPane.style.flex = `0 0 ${percentage}%`;
        }
      } else if (isHResizing) {
        const totalHeight = document.body.offsetHeight;
        const percentage = (e.clientY / totalHeight) * 100;
        if (percentage > 20 && percentage < 90) {
          rightTop.style.flex = `0 0 ${percentage}%`;
        }
      }
    });

    document.addEventListener('mouseup', () => {
      if (isVResizing || isHResizing) {
        isVResizing = false;
        isHResizing = false;
        document.body.style.cursor = 'default';
        ownIframe.style.pointerEvents = 'auto';
        sourceOfTruthIframe.style.pointerEvents = 'auto';
      }
    });

    // Resizing Logic - Horizontal
    let isHResizing = false;
    hDivider.addEventListener('mousedown', (e) => {
      isHResizing = true;
      document.body.style.cursor = 'row-resize';
      ownIframe.style.pointerEvents = 'none';
      sourceOfTruthIframe.style.pointerEvents = 'none';
    });

    // Auto-save notes logic
    notesArea.addEventListener('input', (e) => {
      if (currentStoryId) {
        const val = e.target.value;
        if (val.trim() === '') {
          localStorage.removeItem(`notes_${currentStoryId}`);
        } else {
          localStorage.setItem(`notes_${currentStoryId}`, val);
        }
      }
    });

    function loadNotes(storyId) {
      if (currentStoryId !== storyId) {
        currentStoryId = storyId;
        currentNoteIdLabel.textContent = `(${storyId})`;
        const savedNote = localStorage.getItem(`notes_${storyId}`);
        notesArea.value = savedNote || '';
      }
    }

    // Modal Logic
    const clearNotesBtn = document.getElementById('clearNotesBtn');
    
    fullReportBtn.addEventListener('click', async () => {
      let reportText = '';
      try {
        const response = await fetch('/report-header.txt');
        reportText = await response.text();
      } catch (err) {
        reportText = '# UI Component Discrepancy Report\n\n*(Failed to load custom header)*\n\n';
      }
      
      let hasNotes = false;
      
      // Iterate through local storage
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('notes_')) {
          hasNotes = true;
          const configState = key.replace('notes_', '');
          const note = localStorage.getItem(key);
          
          // Parse a human readable name from the config string (e.g., ui-kit-slider--default)
          const baseId = configState.split(' | ')[0];
          const parts = baseId.split('--');
          let compName = (parts[0] || '').replace('ui-kit-', '').split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
          let storyName = (parts[1] || '').split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
          
          const humanReadableHeader = `${compName}${storyName ? ` (${storyName})` : ''}`;
          
          reportText += `## Component: ${humanReadableHeader}\n**Storybook Config State:** \`${configState}\`\n\n${note}\n\n---\n\n`;
        }
      }
      
      if (!hasNotes) {
        reportText += '*No notes taken yet.*';
      }
      
      reportArea.value = reportText;
      reportModal.style.display = 'flex';
    });

    closeModalBtn.addEventListener('click', () => {
      reportModal.style.display = 'none';
    });
    
    // Close modal on click outside
    reportModal.addEventListener('click', (e) => {
      if (e.target === reportModal) {
        reportModal.style.display = 'none';
      }
    });

    copyReportBtn.addEventListener('click', () => {
      reportArea.select();
      document.execCommand('copy');
      const originalText = copyReportBtn.textContent;
      copyReportBtn.textContent = 'Copied!';
      setTimeout(() => {
        copyReportBtn.textContent = originalText;
      }, 2000);
    });

    clearNotesBtn.addEventListener('click', () => {
      if (confirm('Are you sure you want to delete all your component notes? This cannot be undone.')) {
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('notes_')) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
        
        notesArea.value = '';
        reportArea.value = '*No notes taken yet.*';
      }
    });


    // Diff this project's story against the source-of-truth
    // golden at the configured viewport, computed server-side (see
    // src/devServer.ts), not from what the visible panes happen to show.
    const diffBadge = document.getElementById('diffBadge');
    const thresholdInput = document.getElementById('thresholdInput');
    const diffResult = document.getElementById('diffResult');
    const saveThresholdBtn = document.getElementById('saveThresholdBtn');
    const computeDiffBtn = document.getElementById('computeDiffBtn');
    const goldenView = document.getElementById('goldenView');
    const goldenImg = document.getElementById('goldenImg');
    const goldenSpinner = document.getElementById('goldenSpinner');
    const sourceOfTruthStatusLabel = document.getElementById('sourceOfTruthStatus');
    let goldenResult = null;
    let computing = false;
    let goldenViewKind = 'live';
    let goldenStoryId = '';
    let goldenRequest = 0;
    let savedThreshold = null;
    let thresholdStoryId = '';

    function renderBadge() {
      const r = goldenResult;
      diffResult.style.display = r ? 'inline-flex' : 'none';
      if (!r) return;
      diffBadge.className = 'diff-badge';
      if (r.status === 'no-golden') {
        diffBadge.textContent = 'No golden';
      } else if (r.status === 'size-mismatch') {
        diffBadge.textContent = 'Size mismatch';
        diffBadge.classList.add('over');
      } else {
        diffBadge.textContent = r.diffPixels.toLocaleString();
        diffBadge.classList.add(r.diffPixels > Number(thresholdInput.value) ? 'over' : 'under');
      }
      saveThresholdBtn.disabled = thresholdInput.value === '' || Number(thresholdInput.value) === savedThreshold;
    }

    // Live shows the source-of-truth's live Storybook; Golden shows its
    // stored golden image; Compute Diff shows the diff overlay.
    function renderGoldenImage() {
      const live = goldenViewKind === 'live';
      sourceOfTruthIframe.style.display = live ? '' : 'none';
      document.getElementById('sotSpacer').style.display = live ? '' : 'none';
      goldenView.style.display = live ? 'none' : 'flex';
      goldenSpinner.style.display = !live && goldenViewKind === 'diff' && computing ? 'block' : 'none';
      if (live) return;
      const src = goldenViewKind === 'golden'
        ? `/__golden/image?id=${encodeURIComponent(goldenStoryId)}`
        : goldenResult && goldenResult.diff;
      if (src) goldenImg.src = src; else goldenImg.removeAttribute('src');
      sourceOfTruthStatusLabel.textContent = '';
      if (goldenViewKind === 'diff' && !computing && goldenResult && !goldenResult.diff) {
        sourceOfTruthStatusLabel.textContent = 'No diff image';
      }
    }

    function resetDiff() {
      goldenRequest++;
      goldenResult = null;
      computing = false;
      computeDiffBtn.disabled = false;
      renderBadge();
      renderGoldenImage();
    }

    async function refreshDiff() {
      if (!goldenStoryId) return;
      const request = ++goldenRequest;
      goldenResult = null;
      computing = true;
      computeDiffBtn.disabled = true;
      renderBadge();
      renderGoldenImage();
      try {
        const response = await fetch(`/__golden/diff?id=${encodeURIComponent(goldenStoryId)}`);
        const data = await response.json();
        if (request !== goldenRequest) return;
        if (!response.ok) throw new Error(data.error);
        goldenResult = data;
        savedThreshold = data.threshold;
        // Recomputing keeps an edited threshold; a new story starts from the
        // configured one.
        if (thresholdStoryId !== goldenStoryId) {
          thresholdInput.value = data.threshold;
          thresholdStoryId = goldenStoryId;
        }
      } catch (err) {
        if (request !== goldenRequest) return;
        alert(`Diff failed: ${err.message}`);
      }
      computing = false;
      computeDiffBtn.disabled = false;
      renderBadge();
      renderGoldenImage();
    }

    thresholdInput.addEventListener('input', renderBadge);
    // Save writes this story's override (`stories.<id>.sourceOfTruthThreshold`)
    // to the config file.
    saveThresholdBtn.addEventListener('click', async () => {
      const value = Number(thresholdInput.value);
      const response = await fetch('/__golden/threshold', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: goldenStoryId, value }),
      });
      if (!response.ok) {
        alert(`Could not save threshold: ${(await response.json()).error}`);
        return;
      }
      savedThreshold = value;
      renderBadge();
    });
    goldenImg.addEventListener('error', () => {
      if (goldenViewKind === 'golden') sourceOfTruthStatusLabel.textContent = 'No golden image';
    });
    document.querySelectorAll('.golden-tabs > button').forEach((button) => {
      button.addEventListener('click', () => {
        goldenViewKind = button.dataset.view;
        document.querySelectorAll('.golden-tabs > button').forEach((b) => b.classList.toggle('active', b === button));
        renderGoldenImage();
        // Compute Diff runs the diff every time it is pressed.
        if (goldenViewKind === 'diff') refreshDiff();
      });
    });

    // Same-Origin Polling Syncing
    let lastUrl = '';
    setInterval(() => {
      try {
        const currentUrl = ownIframe.contentWindow.location.href;
        
        if (currentUrl && currentUrl !== lastUrl && currentUrl !== 'about:blank') {
          lastUrl = currentUrl;
          
          const url = new URL(currentUrl);
          const args = url.searchParams.get('args');
          const id = url.searchParams.get('id') || url.searchParams.get('path')?.replace('/story/', '');
          
          if (id) {
            // Determine the full state string to use as the notes key
            const stateId = args ? `${id} | ${args}` : id;
            loadNotes(stateId);

            // Sync search parameters to the outer browser URL in the address bar
            const outerUrl = new URL(window.location.href);
            let urlChanged = false;
            if (outerUrl.searchParams.get('id') !== id) {
              outerUrl.searchParams.set('id', id);
              urlChanged = true;
            }
            if (args) {
              if (outerUrl.searchParams.get('args') !== args) {
                outerUrl.searchParams.set('args', args);
                urlChanged = true;
              }
            } else if (outerUrl.searchParams.has('args')) {
              outerUrl.searchParams.delete('args');
              urlChanged = true;
            }
            if (urlChanged) {
              window.history.replaceState({}, '', outerUrl.pathname + outerUrl.search);
            }
            
            if (goldenStoryId !== id) {
              goldenStoryId = id;
              resetDiff();
            }

            let sotUrl = `http://localhost:${devConfig.sourceOfTruthPort}/iframe.html?id=${id}&viewMode=story`;
            if (args) {
              sotUrl += `&args=${args}`;
            }

            if (sourceOfTruthIframe.src !== sotUrl) {
              sourceOfTruthStatus.textContent = 'Updating...';
              sourceOfTruthStatus.classList.remove('connected');
              sourceOfTruthIframe.src = sotUrl;

              setTimeout(() => {
                sourceOfTruthStatus.textContent = 'Synced';
                sourceOfTruthStatus.classList.add('connected');
              }, 500);
            }
          }
        }
      } catch (e) {
        // Ignore cross-origin errors if they briefly occur during navigation
      }
    }, 100);
  </script>
</body>
</html>
